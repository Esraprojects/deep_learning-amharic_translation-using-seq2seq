# Publishes the in-browser demo (web/) to the gh-pages branch -> GitHub Pages.
name: Deploy web demo
on:
  push:
    branches: [main]
    paths: ["web/**", "results/metrics.json", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r web/* site/
          cp results/metrics.json site/metrics.json
          touch site/.nojekyll
      - name: Push to gh-pages
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy web demo from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
